      $('#next').textContent = state.busy ? '처리 중…' : ['다음: 페이지 확인 →', '새 행으로 가져오기 →', ''][state.step];
      if (state.capture) {
        $('#count').textContent = state.order.length + '개 페이지 감지';
        $('#pageList').innerHTML = state.order.map((id,index) => {
          const page = state.capture.pages.find((item) => item.id === id);
          return '<div class="page-item"><img src="' + page.thumbnail + '" alt="' + escapeHtml(page.name) + ' 미리보기"><div class="page-meta"><span class="number">' + String(index + 1).padStart(2,'0') + '</span><span class="page-title" title="' + escapeHtml(page.name) + '">' + escapeHtml(page.name) + '</span><button class="move" data-move="up" data-index="' + index + '" ' + (index === 0 ? 'disabled' : '') + ' aria-label="위로">↑</button><button class="move" data-move="down" data-index="' + index + '" ' + (index === state.order.length - 1 ? 'disabled' : '') + ' aria-label="아래로">↓</button></div></div>';
        }).join('');
        $('#captureWarnings').innerHTML = state.capture.warnings.length ? '<strong>캡처 알림</strong><ul>' + state.capture.warnings.map((warning) => '<li>' + escapeHtml(warning) + '</li>').join('') + '</ul>' : '';
      }
      if (state.result) {
        $('#success').textContent = state.result.frameIds.length + '개 편집 가능한 프레임이 새 행에 추가됐습니다.';
        $('#resultSummary').textContent = `가로 배치 완료 · Flow 연결 ${state.result.connections}/${Math.max(0, state.result.frameIds.length - 1)}개`;
        $('#resultWarnings').innerHTML = state.result.warnings.length ? '<strong>폰트 대체·변환 알림</strong><ul>' + state.result.warnings.map((warning) => '<li>' + escapeHtml(warning) + '</li>').join('') + '</ul>' : '폰트 대체·변환 알림 없음';
      }
    }
    async function analyze() {
      const files = [...$('#files').files]; if (!files.length) throw new Error('HTML 파일 또는 ZIP을 선택하세요.');
      const payload = await window.h2f.captureFiles(files, $('#renderHost'));
      state.capture = payload; state.order = payload.pages.map((page) => page.id); state.step = 1;
    }
    $('#next').addEventListener('click', async () => {
      if (state.busy) return; showError(''); state.busy = true; render();
      try {
        if (state.step === 0) { await analyze(); state.busy = false; render(); }
        else if (state.step === 1) {
          const capture = { ...state.capture, pages:state.capture.pages.map(({thumbnail, ...page}) => page) };
          parent.postMessage({ pluginMessage:{ type:'import', capture, order:state.order } }, '*');
        }
      } catch (error) { showError(error.message || String(error)); state.busy = false; render(); }
    });
    $('#back').addEventListener('click', () => { state.step = 0; showError(''); render(); });
    $('#pageList').addEventListener('click', (event) => { const button = event.target.closest('[data-move]'); if (!button) return; const index = Number(button.dataset.index); const next = index + (button.dataset.move === 'up' ? -1 : 1); [state.order[index],state.order[next]] = [state.order[next],state.order[index]]; render(); });
    $('#another').addEventListener('click', () => { state.step = 0; state.capture = null; state.order = []; state.result = null; $('#files').value = ''; showError(''); render(); });
    onmessage = (event) => { const message = event.data.pluginMessage; if (!message) return; if (message.type === 'result') { state.result = message.result; state.step = 2; state.busy = false; showError(''); } else if (message.type === 'error') { state.busy = false; showError(message.error); } render(); };
    render();
  </script>
</body>
</html>
