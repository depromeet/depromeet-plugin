name: Check Figma plugin build

on:
  pull_request:
    paths:
      - 'tools/figma-plugins/html-to-figma/**'
      - '.github/workflows/check-figma-build.yml'

permissions:
  contents: read

jobs:
  check-figma-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/figma-plugins/html-to-figma
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/figma-plugins/html-to-figma/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Check committed build matches source
        run: test -z "$(git status --porcelain -- dist/)"
