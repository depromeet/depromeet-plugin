name: Check plugin versions

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-plugin-versions:
    # Temporarily disabled while GitHub hosted runner allocation is unreliable.
    # Remove this condition to re-enable CI.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed plugin versions
        run: >-
          python3 .github/scripts/check_plugin_versions.py
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
